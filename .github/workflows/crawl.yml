name: 每日抓取秋招数据

on:
  # 每天 07:00-21:00 北京时间每隔 2 小时抓取一次（= UTC 23,1,3,5,7,9,11,13 时）
  schedule:
    - cron: "0 23,1,3,5,7,9,11,13 * * *"
  # 可在 GitHub 页面手动触发（Actions -> 每日抓取秋招数据 -> Run workflow）
  workflow_dispatch: {}
  # 代码/爬虫/workflow 变更时自动重跑，便于验证；bot 自动推送数据不触发（见 job if）
  push:
    branches: [main]
    paths:
      - 'crawler/**'
      - '.github/workflows/crawl.yml'
      - 'docs/index.html'
      - 'docs/manifest.json'
      - 'docs/sw.js'

# 双触发源（GitHub schedule + cron-job.org 定时唤醒）可能同时触发，
# 这里保证同一时间只有一个抓取任务在跑，其余排队等待，避免并发提交冲突。
concurrency:
  group: qiuzhao-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 lxml（youoffer 解析依赖）
        run: pip install --quiet lxml

      - name: 运行每日抓取 + 数据构建
        run: python crawler/update_daily.py

      - name: 有新增岗位时写入通知文件
        run: python crawler/notify.py

      - name: 提交并推送最新数据
        run: |
          git config user.name "qiuzhao-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（可能并发），第 $i 次重试：先同步远端再推"
            sleep 5
            git fetch origin main
            if git rebase origin/main; then
              echo "rebase 完成"
            else
              echo "rebase 冲突，采用远端最新数据（并发任务已推送过）"
              git reset --hard origin/main
              git add -A
              git commit -m "chore: 数据同步 $(date -u +'%Y-%m-%d %H:%M') UTC" --allow-empty
            fi
          done
          echo "连续 5 次推送失败"
          exit 1

      - name: 刷新 jsDelivr CDN 缓存
        run: |
          for p in "docs/data/data.json" "docs/js/data.js" "docs/js/app.js" "docs/sw.js" "docs/index.html"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/fengs1x/qiuzhao-daily@main/$p" || echo "ERR")
            echo "purge $p -> $code"
          done
