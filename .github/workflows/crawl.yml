name: 每日抓取秋招数据

on:
  # 每天 07:00-21:00 北京时间每隔 2 小时抓取一次（= UTC 23,1,3,5,7,9,11,13 时）
  schedule:
    - cron: "0 23,1,3,5,7,9,11,13 * * *"
  # 也可在 GitHub 页面手动触发（Actions -> 每日抓取秋招数据 -> Run workflow）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 lxml（youoffer 解析依赖）
        run: pip install --quiet lxml

      - name: 运行每日抓取 + 数据构建
        run: python crawler/update_daily.py

      - name: 有新增岗位时写入通知文件
        run: python - <<'EOF'
import json, os, datetime

DATA = "docs/data/data.json"
STATE = "docs/notify-state.json"
NOTIFY = "docs/latest_notify.json"

def now_bj():
    return datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))

try:
    d = json.load(open(DATA, encoding="utf-8"))
except Exception as e:
    print("读取 data.json 失败：", e); raise SystemExit(0)

meta = d.get("meta", {})
today = now_bj().strftime("%Y-%m-%d")
companies = d.get("companies", [])
today_new = [c for c in companies if c.get("status") == "today_new"]
n = len(today_new)
n26 = len([c for c in today_new if c.get("is_26")])
gen = meta.get("generated_at", "")

try:
    st = json.load(open(STATE, encoding="utf-8")) if os.path.exists(STATE) else {}
except Exception:
    st = {}
st_date = st.get("date", "")
st_count = int(st.get("today_new_count", 0))

should_notify = False
if today != st_date:
    if n > 0:
        should_notify = True
elif n > st_count:
    should_notify = True

if not should_notify:
    print("无新增岗位，不写通知（date=%s 今日新增=%d 上次=%s/%d）" % (today, n, st_date, st_count))
    raise SystemExit(0)

msg = "今日新增 %d 家公司，其中 26 届可投 %d 家。" % (n, n26)
if gen:
    msg += "（数据更新于 %s）" % gen

nf = {
    "id": int(now_bj().timestamp()),
    "title": "🎯 秋招有新岗位",
    "msg": msg,
    "at": now_bj().strftime("%Y-%m-%d %H:%M:%S")
}
json.dump(nf, open(NOTIFY, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
json.dump({"date": today, "today_new_count": n}, open(STATE, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
print("已写入通知文件：", NOTIFY, "→", msg)
EOF

      - name: 提交并推送最新数据
        run: |
          git config user.name "qiuzhao-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: 数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 刷新 jsDelivr CDN 缓存
        run: |
          for p in "docs/data/data.json" "docs/js/data.js" "docs/js/app.js" "docs/sw.js" "docs/index.html"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/fengs1x/qiuzhao-daily@main/$p")
            echo "purge $p -> $code"
          done
