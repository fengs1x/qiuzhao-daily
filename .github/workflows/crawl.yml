name: 每日抓取秋招数据

on:
  # 每天 21:00 北京时间（= 13:00 UTC）自动抓取一次
  schedule:
    - cron: "0 13 * * *"
  # 也可在 GitHub 页面手动触发（Actions -> 每日抓取秋招数据 -> Run workflow）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 lxml（youoffer 解析依赖）
        run: pip install --quiet lxml

      - name: 运行每日抓取 + 数据构建
        run: python crawler/update_daily.py

      - name: 提交并推送最新数据
        run: |
          git config user.name "qiuzhao-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
