name: 连通性诊断
on:
  push:
    paths:
      - 'diag-trigger.txt'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python 与 lxml
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet lxml

      - name: 复现 crawl 全部步骤（不中断，逐段记录退出码）
        run: |
          set +e
          : > dump-a.txt
          echo "==== STEP-A update_daily ====" >> dump-a.txt
          python crawler/update_daily.py >> dump-a.txt 2>&1
          echo "A_EXIT=$?" >> dump-a.txt
          echo "==== STEP-B 通知脚本 ====" >> dump-a.txt
          python - <<'EOF' >> dump-a.txt 2>&1
import json, os, datetime
DATA = "docs/data/data.json"
STATE = "docs/notify-state.json"
NOTIFY = "docs/latest_notify.json"
def now_bj():
    return datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
try:
    d = json.load(open(DATA, encoding="utf-8"))
except Exception as e:
    print("读取 data.json 失败：", e); raise SystemExit(0)
meta = d.get("meta", {})
today = now_bj().strftime("%Y-%m-%d")
companies = d.get("companies", [])
today_new = [c for c in companies if c.get("status") == "today_new"]
n = len(today_new)
n26 = len([c for c in today_new if c.get("is_26")])
gen = meta.get("generated_at", "")
try:
    st = json.load(open(STATE, encoding="utf-8")) if os.path.exists(STATE) else {}
except Exception:
    st = {}
st_date = st.get("date", "")
st_count = int(st.get("today_new_count", 0))
should_notify = False
if today != st_date:
    if n > 0:
        should_notify = True
elif n > st_count:
    should_notify = True
if not should_notify:
    print("无新增岗位，不写通知（date=%s 今日新增=%d 上次=%s/%d）" % (today, n, st_date, st_count))
    raise SystemExit(0)
msg = "今日新增 %d 家公司，其中 26 届可投 %d 家。" % (n, n26)
if gen:
    msg += "（数据更新于 %s）" % gen
nf = {"id": int(now_bj().timestamp()), "title": "🎯 秋招有新岗位", "msg": msg, "at": now_bj().strftime("%Y-%m-%d %H:%M:%S")}
json.dump(nf, open(NOTIFY, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
json.dump({"date": today, "today_new_count": n}, open(STATE, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
print("已写入通知文件：", NOTIFY, "→", msg)
EOF
          echo "B_EXIT=$?" >> dump-a.txt
          echo "==== STEP-C git commit/push ====" >> dump-a.txt
          git config user.name "qiuzhao-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交" >> dump-a.txt
          else
            git commit -m "chore: 数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC" >> dump-a.txt 2>&1
            git push >> dump-a.txt 2>&1
          fi
          echo "C_EXIT=$?" >> dump-a.txt
          echo "==== STEP-D purge CDN ====" >> dump-a.txt
          for p in "docs/data/data.json" "docs/js/data.js"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/fengs1x/qiuzhao-daily@main/$p")
            echo "purge $p -> $code" >> dump-a.txt
          done
          echo "D_EXIT=$?" >> dump-a.txt
          exit 0

      - name: 提交诊断结果回仓库
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@example.com"
          git add dump-a.txt
          git commit -m "diag: crawl 全步骤复现输出" || echo "无变更"
          git push || echo "推送失败（忽略）"
