name: 连通性诊断
on:
  push:
    paths:
      - 'diag-trigger.txt'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python 与 lxml
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet lxml

      - name: 复现 crawl（捕获完整输出）
        run: |
          {
            echo "==== python $(python --version) ===="
            echo "==== 开始复现 update_daily.py ===="
            python crawler/update_daily.py
            echo "==== EXIT_CODE=$? ===="
          } > crawl-dump.txt 2>&1

      - name: 提交诊断结果回仓库
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@example.com"
          git add crawl-dump.txt
          git commit -m "diag: crawl 复现输出" || echo "无变更"
          git push || echo "推送失败（忽略）"
